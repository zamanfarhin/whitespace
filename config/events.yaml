    directory_url: https://pru26.mapyourshow.com/8_0/explore/exhibitor-gallery.cfm
    host: pru26.mapyourshow.com
    # Upcoming. This is an outreach hook the message can name directly.
    weight_note: outreach_trigger

  - slug: media-expo-delhi-2026
    name: Media Expo New Delhi 2026
