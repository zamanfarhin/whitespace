# Event sources.
#
# Adding a new event is a block in this file, not new code. Adding a new
# *kind* of directory is a new adapter in src/sources/. That split is the
# scalability claim, and it holds because two of the biggest shows in this
# industry happen to run on the same platform.
#
# `directory_url` was checked by hand. Aggregator sites disagree with
# organizers constantly (SGI Dubai has four different published date ranges
# across four listing sites), so nothing in here comes from an aggregator.

adapters:
  # MapYourShow powers several hundred North American trade shows. One
  # adapter, many events. This is why the US spine was worth keeping even
  # after deciding to lead with India.
  mapyourshow:
    rate_limit_per_sec: 2
    respect_robots: true
  # Messe Frankfurt runs a standard exhibitor-search across its fairs
  # worldwide. In principle the same property as MapYourShow; in practice
  # their search is rendered client-side, so this adapter currently reports
  # a coverage gap rather than data. Left wired up because the platform is
  # the right unit of work and the gap is worth surfacing.
  messe_frankfurt:
    rate_limit_per_sec: 2
    respect_robots: true
  # Anything else. Slower and less reliable, used per-event.
  html_list:
    rate_limit_per_sec: 1
    respect_robots: true

events:
  - slug: isa-sign-expo-2026
    name: ISA International Sign Expo 2026
    organizer: International Sign Association
    region: north_america
    city: Orlando
    country: US
    starts_on: 2026-04-08
    ends_on: 2026-04-10
    adapter: mapyourshow
    directory_url: https://isasignexpo2026.mapyourshow.com/8_0/explore/exhibitor-gallery.cfm
    host: isasignexpo2026.mapyourshow.com
    # Past show. Exhibiting here is evidence of engagement, not a trigger.
    weight_note: engagement_signal
    # Returns nothing as of Aug 2026: the print export appears to be retired
    # once a show closes. Kept in the config so the coverage report names
    # the gap rather than the event silently disappearing.

  - slug: printing-united-2026
    name: PRINTING United Expo 2026
